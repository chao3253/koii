<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fbe"/>
      <stop offset="1" stop-color="#f04480"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- 原创双心交叠：左心略偏冷粉，右心略偏暖粉，交叠处形成第三颗小心 -->
  <g transform="translate(64 66)">
    <path d="M0 26 C-34 4 -40 -20 -22 -26 C-9 -30 0 -20 0 -12 C0 -20 9 -30 22 -26 C40 -20 34 4 0 26 Z"
          fill="#ffffff" opacity="0.95"/>
    <path d="M-8 16 C-28 2 -32 -14 -20 -18 C-11 -21 -6 -14 -6 -8"
          fill="none" stroke="#ffd0e2" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- 顶部小星点，呼应梦幻氛围 -->
  <circle cx="34" cy="32" r="3" fill="#ffffff" opacity="0.85"/>
  <circle cx="98" cy="40" r="2.4" fill="#ffffff" opacity="0.7"/>
  <circle cx="92" cy="26" r="1.8" fill="#ffffff" opacity="0.6"/>
</svg>
